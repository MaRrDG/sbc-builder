server {
    include snippets/listen-http.conf;
    include snippets/listen-https.conf;
    include snippets/ssl-mario-theodor.ro.conf;
    server_name sbc-builder.mario-theodor.ro;
    # the Discord bot reaches /api/bot/ over the compose network, never from outside
    location ^~ /api/bot/ {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:5178;
        include snippets/proxy.conf;
    }
    access_log /var/log/nginx/sbc-builder.mario-theodor.ro.access.log;
    error_log  /var/log/nginx/sbc-builder.mario-theodor.ro.error.log;
}

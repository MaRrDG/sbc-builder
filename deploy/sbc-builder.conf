# Apache vhost for sbc-builder.mario-theodor.ro behind Cloudflare (SSL mode: Flexible).
# Cloudflare terminates HTTPS and talks to this server over plain HTTP on port 80,
# so there must be NO http->https redirect here (it would loop). Turn on
# "Always Use HTTPS" in Cloudflare instead.
# Needs: a2enmod proxy proxy_http headers remoteip
<VirtualHost *:80>
    ServerName sbc-builder.mario-theodor.ro

    # Real visitor IP from Cloudflare
    RemoteIPHeader CF-Connecting-IP

    ProxyPreserveHost On
    ProxyTimeout 90
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:5178/
    ProxyPassReverse / http://127.0.0.1:5178/

    ErrorLog  ${APACHE_LOG_DIR}/sbc-builder-error.log
    CustomLog ${APACHE_LOG_DIR}/sbc-builder-access.log combined
</VirtualHost>

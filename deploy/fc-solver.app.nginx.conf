# Production: fc-solver.app (Cloudflare Full (strict) with the Cloudflare Origin Certificate in snippets/ssl-fc-solver.app.conf).
server {
    include snippets/listen-http.conf;
    include snippets/listen-https.conf;
    include snippets/ssl-fc-solver.app.conf;
    server_name www.fc-solver.app;
    return 301 https://fc-solver.app$request_uri;
}
server {
    include snippets/listen-http.conf;
    include snippets/listen-https.conf;
    include snippets/ssl-fc-solver.app.conf;
    server_name fc-solver.app;
    # the Discord bot reaches /api/bot/ over the compose network, never from outside
    location ^~ /api/bot/ {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:5179;
        include snippets/proxy.conf;
    }
    access_log /var/log/nginx/fc-solver.app.access.log;
    error_log  /var/log/nginx/fc-solver.app.error.log;
}

services:
  app:
    image: sbc-builder:latest
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY in .env}
    container_name: sbc-builder
    restart: unless-stopped
    # only Apache on the host talks to it
    ports:
      - "127.0.0.1:5178:5178"
    volumes:
      - ./data:/app/data
    environment:
      SBC_DROP_TIME: "20:01"
      SBC_DROP_TZ: Europe/Bucharest
      DATABASE_URL: postgres://fcsolver:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/fcsolver
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      # the domain search engines index (canonical links, sitemap); other hosts answer noindex
      SITE_URL: ${SITE_URL:-}
      # evolution emails (Resend); without the key they are only logged. EMAIL_SECRET signs unsubscribe links (default: CLERK_SECRET_KEY)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_SECRET: ${EMAIL_SECRET:-}
      # OpenWebTrack <script> tag (cookieless); empty = no analytics
      ANALYTICS_SNIPPET: ${ANALYTICS_SNIPPET:-}
      # Discord bot API (/api/bot/*); empty = off. The bot service gets the same value.
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5178/api/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3

  bot:
    # same image as app; only started with: docker compose --profile discord up -d
    image: sbc-builder:latest
    pull_policy: never
    container_name: sbc-builder-bot
    profiles: [discord]
    restart: unless-stopped
    command: ["node", "--import", "tsx", "discord/index.ts"]
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APP_ID: ${DISCORD_APP_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      BOT_API_URL: http://app:5178
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
      SITE_URL: ${SITE_URL:-}
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: sbc-builder-db
    restart: unless-stopped
    # no ports: only the app reaches it, over the compose network
    environment:
      POSTGRES_USER: fcsolver
      POSTGRES_DB: fcsolver
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcsolver -d fcsolver"]
      interval: 10s
      timeout: 5s
      retries: 5

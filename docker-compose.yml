# One file for every environment: APP_NAME / APP_PORT in .env tell them apart (dev: sbc-builder on 5178, prod: fc-solver on 5179).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: ${APP_NAME:-sbc-builder}:latest
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY in .env}
    container_name: ${APP_NAME:-sbc-builder}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    logging: *logging
    # only nginx on the host talks to it
    ports:
      - "127.0.0.1:${APP_PORT:-5178}:5178"
    volumes:
      - ./data:/app/data
    environment:
      SBC_DROP_TIME: "20:01"
      SBC_DROP_TZ: Europe/Bucharest
      DATABASE_URL: postgres://fcsolver:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/fcsolver
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      # the domain search engines index (canonical links, sitemap); other hosts answer noindex
      SITE_URL: ${SITE_URL:-}
      # origins whose Clerk session tokens are accepted (comma list); empty = localhost + SITE_URL
      SITE_ORIGINS: ${SITE_ORIGINS:-}
      # evolution emails (Resend); without the key they are only logged. EMAIL_SECRET signs unsubscribe links (default: CLERK_SECRET_KEY)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_SECRET: ${EMAIL_SECRET:-}
      # OpenWebTrack <script> tag (cookieless); empty = no analytics
      ANALYTICS_SNIPPET: ${ANALYTICS_SNIPPET:-}
      # Discord bot API (/api/bot/*); empty = off. The bot service gets the same value.
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
      # invite link shown on the Linked accounts screen and in the sidebar ("Join our Discord"); empty = hidden
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-}
      # Paddle billing (docs/billing.md); any one empty = billing off. sandbox on dev, production on prod
      PADDLE_ENV: ${PADDLE_ENV:-}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_PRICE_MONTH: ${PADDLE_PRICE_MONTH:-}
      PADDLE_PRICE_YEAR: ${PADDLE_PRICE_YEAR:-}
      # tuning and owner settings; empty = the server default (readers treat '' as unset)
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FREE_WEEKLY_SOLVES: ${FREE_WEEKLY_SOLVES:-}
      EA_DAILY_LIMIT: ${EA_DAILY_LIMIT:-}
      CLUB_MANUAL_COOLDOWN_MIN: ${CLUB_MANUAL_COOLDOWN_MIN:-}
      DAILY_SECRET: ${DAILY_SECRET:-}
      # salt of the IP hashes in the admin event log (empty: derived from EMAIL_SECRET / CLERK_SECRET_KEY)
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      DAILY_MIN_RATING: ${DAILY_MIN_RATING:-}
      DAILY_RATING_FLOOR: ${DAILY_RATING_FLOOR:-}
      DAILY_MIN_POOL: ${DAILY_MIN_POOL:-}
      DAILY_HARD_MIN_POOL: ${DAILY_HARD_MIN_POOL:-}
      DAILY_WOMEN_SHARE: ${DAILY_WOMEN_SHARE:-}
      DAILY_WOMEN_MIN_RATING: ${DAILY_WOMEN_MIN_RATING:-}
      DAILY_WOMEN_RATING_FLOOR: ${DAILY_WOMEN_RATING_FLOOR:-}
      DAILY_WOMEN_MIN_POOL: ${DAILY_WOMEN_MIN_POOL:-}
      DAILY_WOMEN_HARD_MIN: ${DAILY_WOMEN_HARD_MIN:-}
      DAILY_ICON_SHARE: ${DAILY_ICON_SHARE:-}
      DAILY_ICON_MIN_RATING: ${DAILY_ICON_MIN_RATING:-}
      DAILY_ICON_HARD_MIN: ${DAILY_ICON_HARD_MIN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5178/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

  bot:
    # same image as app; runs only where .env has COMPOSE_PROFILES=discord (prod only; dev shares the token, never)
    image: ${APP_NAME:-sbc-builder}:latest
    pull_policy: never
    container_name: ${APP_NAME:-sbc-builder}-bot
    profiles: [discord]
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    command: ["node", "--import", "tsx", "discord/index.ts"]
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APP_ID: ${DISCORD_APP_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      BOT_API_URL: http://app:5178
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
      SITE_URL: ${SITE_URL:-}
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: ${APP_NAME:-sbc-builder}-db
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    # no ports: only the app reaches it, over the compose network
    environment:
      POSTGRES_USER: fcsolver
      POSTGRES_DB: fcsolver
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcsolver -d fcsolver"]
      interval: 10s
      timeout: 5s
      retries: 5
